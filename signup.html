<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/signup.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>สมัครสมาชิก</h1>
    <p class="subtitle">สมัครแล้วเข้าใช้งานได้ทันทีในบทบาทผู้ขอลา (employee)</p>

    <div class="card" style="max-width:420px">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>

      <form id="ฟอร์มสมัคร">
        <label for="name">ชื่อ-นามสกุล</label>
        <input type="text" id="name" placeholder="เช่น สมชาย ใจดี" required>

        <label for="email">อีเมล</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6">

        <div class="btn-row">
          <button type="submit" id="ปุ่มสมัคร">สมัครสมาชิก</button>
        </div>
      </form>

      <p class="hint" style="margin-top:16px">
        มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
      </p>
    </div>
  </div>
</body>
</html>
